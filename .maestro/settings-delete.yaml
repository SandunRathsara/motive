appId: dev.motive.app
---
- launchApp:
    clearState: true
- runFlow: subflows/onboard.yaml
- assertVisible:
    text: "Today"
    selected: true
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "Delete all data"
    direction: DOWN
- tapOn: "Delete all data"
- assertVisible: "Before you delete"
- assertVisible: 'This removes all Motive data on this device\. Apple Health data and already-shared exports are not erased\..*'
# Keep the confirmation reachable with enlarged text as well as the default simulator size.
- scrollUntilVisible:
    element:
      text: "Continue"
    direction: DOWN
- tapOn: "Continue"
- assertVisible: "This cannot be undone. Motive will return to a fresh start."
- tapOn: "Delete everything"
- assertVisible: "About you"
- assertNotVisible: "Plan v1"
- assertNotVisible: "Your targets"
- assertNotVisible: "MOTIVE · RECOVERY"
- assertNotVisible: "Deletion not finished"
- assertNotVisible: "Export data"
# Reseeded app content must allow a new Profile and restart the version sequence.
- runFlow: subflows/onboard.yaml
- assertVisible: ".*starting estimate.*"
- assertVisible: "Plan v1"
- assertNotVisible: "Plan v2 · changed today"
