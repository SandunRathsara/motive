appId: dev.motive.app
---
- launchApp:
    clearState: true
# ShellTabBar accessibilityLabel maps to Maestro's text selector on iOS.
# Selected state distinguishes the tab from duplicate accessible header nodes.
- assertVisible: "Today"
- tapOn:
    text: "Today"
    selected: true
- assertVisible: "Your daily overview is coming next. There’s nothing you need to do here yet."
- assertVisible: "Not built yet"
- assertNotVisible: "MOTIVE · RECOVERY"
- assertVisible: "Train"
- tapOn: "Train"
- assertVisible:
    text: "Train"
    selected: true
- assertVisible: "Your training space is coming next. Make yourself at home."
- assertVisible: "Not built yet"
- assertNotVisible: "MOTIVE · RECOVERY"
- assertVisible: "Fuel"
- tapOn: "Fuel"
- assertVisible:
    text: "Fuel"
    selected: true
- assertVisible: "Your food journal is coming next. Nothing to log here just yet."
- assertVisible: "Not built yet"
- assertNotVisible: "MOTIVE · RECOVERY"
- assertVisible: "Coach"
- tapOn: "Coach"
- assertVisible:
    text: "Coach"
    selected: true
- assertVisible: "Your coaching space is coming next. We’ll take it one step at a time."
- assertVisible: "Not built yet"
- assertNotVisible: "MOTIVE · RECOVERY"
- tapOn: "Today"
- assertVisible:
    text: "Today"
    selected: true
- assertVisible: "Your daily overview is coming next. There’s nothing you need to do here yet."
- assertNotVisible: "MOTIVE · RECOVERY"
