appId: dev.motive.app
---
- launchApp:
    clearState: true
- runFlow: subflows/onboard.yaml
- assertVisible:
    text: "Today"
    selected: true
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "Export data"
    direction: DOWN
- tapOn: "Export data"
- assertVisible: "This file is not encrypted and contains your health record. Anyone who can open it can read it."
- tapOn: "Continue to share sheet"
# iOS 27.2 simulator UIActivityViewController (English): the sheet shows the neutral dated file
# name and offers Save to Files; it has no Close button and is dismissed through its
# full-screen PopoverDismissRegion ("dismiss popup"). Its centre is covered by the sheet, so tap
# the uncovered top of the region. Other iOS versions may need a different dismiss selector.
- assertVisible: "motive-export-.*"
- assertVisible: "Save to Files"
- assertVisible:
    id: "PopoverDismissRegion"
- tapOn:
    point: "50%,8%"
- assertVisible: "Export finished."
- tapOn: "Done"
- assertVisible:
    text: "Export data"
    enabled: true
- assertVisible: "Phase 1 report"
- assertNotVisible: "MOTIVE · RECOVERY"
